name: Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    # ubuntu-latest kini Ubuntu 26 dan setup-android di image itu gagal
    # mengambil paket platforms;android-35 ("Failed to find package").
    # Pakai ubuntu-24.04 yang sudah terbukti jalan untuk workflow ini.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pakai Android SDK bawaan runner (cmdline-tools 20.0, sudah termasuk
      # platform-tools). android-actions/setup-android@v3 gagal dua kali di
      # sini karena memaksa cmdline-tools 16.0 yang tidak bisa mengambil paket
      # platforms;android-35 ("Failed to find package").
      - name: Set up Android SDK (preinstalled)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      # Electron's postinstall downloads a binary we do not need for the web build.
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Android SDK packages
        run: |
          for pkg in "platform-tools" "platforms;android-35" "build-tools;35.0.0"; do
            if sdkmanager --list_installed | grep -q "$pkg"; then
              echo "$pkg already installed"
            else
              sdkmanager "$pkg"
            fi
          done

      - name: Install Capacitor tooling
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build renderers as web apps
        run: node mobile/scripts/build-web.mjs

      - name: Obfuscate web assets
        run: node mobile/scripts/obfuscate-web.mjs

      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Android fullscreen shell patch
        working-directory: mobile
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - uses: actions/upload-artifact@v4
        with:
          name: andi-kore-office-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: andi-kore-office-v0.1.2-beta
          name: Andi Kore Office v0.1.2-beta
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
